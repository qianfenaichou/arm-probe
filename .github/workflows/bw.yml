name: arm64-bandwidth
on: workflow_dispatch
permissions:
  contents: read
jobs:
  bw:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: build and run
        run: |
          cat > bw2.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <time.h>
          #include <pthread.h>

          static uint8_t *buf;
          static size_t bytes;

          typedef struct { size_t off, len; uint64_t sink; } targ_t;

          static void *worker(void *p) {
              targ_t *t = (targ_t *)p;
              const uint64_t *q = (const uint64_t *)(buf + t->off);
              size_t n = t->len / 64;
              uint64_t s0 = 0, s1 = 0, s2 = 0, s3 = 0, s4 = 0, s5 = 0, s6 = 0, s7 = 0;
              for (size_t i = 0; i < n; i++) {
                  const uint64_t *b = q + i * 8;
                  s0 += b[0]; s1 += b[1]; s2 += b[2]; s3 += b[3];
                  s4 += b[4]; s5 += b[5]; s6 += b[6]; s7 += b[7];
              }
              t->sink = s0 + s1 + s2 + s3 + s4 + s5 + s6 + s7;
              return NULL;
          }

          static double now(void) {
              struct timespec ts;
              clock_gettime(CLOCK_MONOTONIC, &ts);
              return (double)ts.tv_sec + (double)ts.tv_nsec * 1e-9;
          }

          int main(int argc, char **argv) {
              int th = argc > 1 ? atoi(argv[1]) : 4;
              size_t mb = argc > 2 ? (size_t)atoi(argv[2]) : 512;
              bytes = mb * 1024UL * 1024UL;
              buf = (uint8_t *)malloc(bytes);
              if (!buf) { perror("malloc"); return 1; }
              memset(buf, 1, bytes);
              pthread_t tid[16]; targ_t a[16];
              size_t chunk = bytes / (size_t)th;
              chunk -= chunk % 64;
              for (int r = 0; r < 3; r++) {
                  double t0 = now();
                  for (int i = 0; i < th; i++) {
                      a[i].off = (size_t)i * chunk;
                      a[i].len = (i == th - 1) ? (bytes - (size_t)i * chunk) : chunk;
                      a[i].sink = 0;
                      pthread_create(&tid[i], NULL, worker, &a[i]);
                  }
                  uint64_t acc = 0;
                  for (int i = 0; i < th; i++) { pthread_join(tid[i], NULL); acc += a[i].sink; }
                  double dt = now() - t0;
                  printf("th=%2d mb=%4zu r=%d sec=%7.3f gbs=%6.2f sum=%llu\n",
                         th, mb, r, dt, (double)bytes / dt / 1e9, (unsigned long long)acc);
                  fflush(stdout);
              }
              return 0;
          }
          EOF
          gcc --version | head -1 | tee bw.out
          gcc -O3 -o bw2 bw2.c -pthread
          for T in 1 2 4 8; do ./bw2 $T 512; echo; done >> bw.out 2>&1
          cat bw.out
      - uses: actions/upload-artifact@v4
        with:
          name: arm-bw
          path: |
            bw.out
            bw2.c
