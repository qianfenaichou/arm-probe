name: arm64-env
on: workflow_dispatch
permissions:
  contents: read
jobs:
  env:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - run: |
          {
            echo "gcc=$(gcc --version | head -1)"
            echo "cmake=$(cmake --version | head -1)"
            echo "arch_native=$(gcc -march=native -Q --help=target 2>/dev/null | grep -m1 'march=' || true)"
            echo "lscpu_opt=$(lscpu | grep -m1 'Model name')"
            echo "nproc=$(nproc)"
            echo "os=$(grep PRETTY_NAME /etc/os-release)"
          } | tee env.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arm-env
          path: env.txt
